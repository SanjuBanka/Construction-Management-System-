spring.application.name=swpm

# MySQL — reads from env vars in production, falls back to local dev defaults
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/swpm_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server — Railway/Render inject PORT; default to 8080 for local dev
server.port=${PORT:8080}

# JWT — ALWAYS override jwt.secret via env var in production
jwt.secret=${JWT_SECRET:swpm_super_secret_key_change_this_in_production_min_256_bits_long}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS — set to your deployed frontend URL in production (comma-separated for multiple)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
